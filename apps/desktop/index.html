<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what lets the app paint under a notch and then
         inset itself with env(safe-area-inset-*): without it a fullscreen
         home-screen copy is letterboxed above the home indicator and beside a
         landscape notch. `interactive-widget` keeps the keyboard shrinking the
         layout instead of covering the composer. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Boot constant only: applyTheme() rewrites this to the painted chrome
         colour on the first frame and on every theme change. -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Home-screen install: iOS reads these metas, not the manifest, for the
         standalone flag and the dock label; Android's Chromium reads the
         `mobile-web-app-capable` twin. Without them an "Add to Home Screen"
         copy of the webapp opens with Safari/Chrome chrome around it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hermes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />
    <title>Hermes</title>
    <script>
      // Which host this renderer is running in, before the first paint. The
      // touch layout (`styles.css` gated on html[data-hermes-desktop-host='browser'])
      // and `isBrowserHostedDesktop()` both key off this marker, and until now it
      // was written only at the END of installBrowserDesktopBridge() — which
      // returns early when there is no bootstrap (the /login surface) and, in the
      // signed-in app, lands after the whole module graph has run. On a phone that
      // meant a desktop-styled sign-in form (13.3px inputs → iOS zooms on focus)
      // and a visible reflow into the 44px touch layout. Electron's preload sets
      // window.hermesDesktop before this script runs, so the guard is exact.
      // browser-desktop-bridge.ts:169 keeps writing it as the idempotent backstop.
      if (!window.hermesDesktop) {
        document.documentElement.dataset.hermesDesktopHost = 'browser'
      }
      // Pre-paint the themed background before the app bundle loads. Without
      // this, the first frame (which is what `ready-to-show` waits for) is the
      // UA-default white page, and the real theme only lands once the whole
      // module graph has executed — i.e. the "white flash" on every new
      // window. applyTheme() in src/themes/context.tsx keeps these keys fresh.
      //
      // OPAQUE WINDOWS ONLY. The `?win=` kinds Electron creates with
      // `transparent: true` already have a clear canvas, and pre-painting a
      // theme colour there does not prevent a flash, it IS the flash: an
      // opaque rectangle standing until that window's module graph executes.
      // The list is TRANSPARENT_WINDOWS in src/lib/transparent-windows.ts — keep the two in step.
      // `secondary` (a session window) and `browser` are opaque and DO want the
      // pre-paint.
      try {
        const win = new URLSearchParams(window.location.search).get('win')
        if (!win || ['hud', 'overlay', 'quick', 'wake'].indexOf(win) === -1) {
          let bg = localStorage.getItem('hermes-boot-background')
          let scheme = localStorage.getItem('hermes-boot-color-scheme')
          if (!bg) {
            const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
            bg = dark ? '#111111' : '#f7f7f7'
            scheme = dark ? 'dark' : 'light'
          }
          document.documentElement.style.backgroundColor = bg
          if (scheme === 'dark' || scheme === 'light') {
            document.documentElement.style.colorScheme = scheme
          }
        }
      } catch {
        // localStorage unavailable — keep UA defaults.
      }
    </script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
